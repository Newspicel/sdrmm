# Supply-chain gate for `cargo xtask audit` (CI mirrors it verbatim).

[advisories]
# Unsound advisories default to workspace-direct crates; a transitive dependency can
# dereference a null pointer just as well as a direct one.
unsound = "all"
# Unmaintained is the opposite case: it is only actionable for crates we chose ourselves.
# `paste` arrives through `utoipa-axum`, and pinning upstream notices as ignores would bury the
# advisories we can actually reason about.
unmaintained = "workspace"
# An exception that no longer applies is a lie about the tree, so make it fail rather than warn.
unused-ignored-advisory = "deny"

[licenses]
# Everything the AGPL-3.0-or-later binaries may carry. GPL-3.0-only, LGPL-2.1-or-later and the
# proprietary licenses are absent on purpose: a crate that offers nothing else fails here.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-only",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

[bans]
# Duplicate versions are somebody else's dependency tree, `windows-sys` above all.
# `cargo xtask check` pins the pair that actually breaks a build (gpu-allocator vs wgpu-hal).
multiple-versions = "allow"
wildcards = "deny"
# The internal crates are path dependencies of unpublished crates, declared without a version.
allow-wildcard-paths = true

deny = [
    { crate = "openssl-sys", reason = "TLS is rustls everywhere; linking OpenSSL would break the portable archives and the Nix build" },
    { crate = "openssl", reason = "TLS is rustls everywhere; linking OpenSSL would break the portable archives and the Nix build" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The nine `xng-*` decoders are vendored from one pinned revision and nothing else is fetched
# from a git host. A new entry here is a supply-chain decision, not a dependency bump.
allow-git = ["https://github.com/airframesio/xng"]
