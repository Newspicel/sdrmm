# Supply-chain gate for `cargo xtask audit` (CI mirrors it verbatim).

[advisories]
# Unsound advisories default to workspace-direct crates, which hides RUSTSEC-2024-0429:
# the one advisory in this tree that is a soundness bug rather than a "no longer maintained"
# notice. A transitive dependency can dereference a null pointer just as well as a direct one.
unsound = "all"
# Unmaintained is the opposite case: it is only actionable for crates we chose ourselves.
# Nothing unmaintained here today is one: the ten gtk3-rs crates, five `unic-*` and
# `proc-macro-error` arrive through `tauri`, `paste` through `utoipa-axum`, and pinning them
# as ignores would bury the advisories we can actually reason about under a wall of upstream
# noise.
unmaintained = "workspace"
# An exception that no longer applies is a lie about the tree, so make it fail rather than warn:
# when tauri finally moves off gtk3, this gate is what tells us to delete the ignore below.
unused-ignored-advisory = "deny"

ignore = [
    # `glib` 0.18.5 is the newest version that can exist in this graph: the fix landed in
    # 0.20.0, gtk3-rs is end-of-life at 0.18.2 (its 0.18 branch has had no commit since
    # Dec 2023), and tauri v2 pins that whole stack through tao/wry/gtk/webkit2gtk. The
    # affected functions, `VariantStrIter::{next,nth,last,next_back,nth_back}`, are called
    # by nothing in the graph: glib is the only crate here that so much as names the type, and
    # it reaches us only through the Linux desktop shell. Drop this the day tauri ships gtk4.
    { id = "RUSTSEC-2024-0429", reason = "glib::VariantStrIter is unreachable here, and no fixed version exists below glib 0.20 / gtk4" },
]

[licenses]
# Everything the AGPL-3.0-or-later binaries may carry. GPL-3.0-only, LGPL-2.1-or-later and the
# proprietary licenses are absent on purpose: a crate that offers nothing else fails here.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-only",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

[bans]
# Duplicate versions are somebody else's dependency tree: tauri alone brings four `windows-sys`.
# `cargo xtask check` pins the pair that actually breaks a build (gpu-allocator vs wgpu-hal).
multiple-versions = "allow"
wildcards = "deny"
# The internal crates are path dependencies of unpublished crates, declared without a version.
allow-wildcard-paths = true

deny = [
    { crate = "openssl-sys", reason = "TLS is rustls everywhere; linking OpenSSL would break the portable archives and the Nix build" },
    { crate = "openssl", reason = "TLS is rustls everywhere; linking OpenSSL would break the portable archives and the Nix build" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The nine `xng-*` decoders are vendored from one pinned revision and nothing else is fetched
# from a git host. A new entry here is a supply-chain decision, not a dependency bump.
allow-git = ["https://github.com/airframesio/xng"]
