name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  check:
    name: Static gate (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu-check
          save: ${{ env.SAVE_CACHE }}
      - run: cargo xtask check

  etsi:
    name: DVB tables vs ETSI (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: rustup show
      - run: python3 crates/modem-test-support/scripts/dvbs2_spec_check.py --cache "$RUNNER_TEMP/etsi" --dvbs2 crates/channels/src/datv/dvbs2
      - run: python3 crates/modem-test-support/scripts/s2x_tables.py --cache "$RUNNER_TEMP/etsi" --out crates/channels/src/datv/dvbs2 --check
      - run: python3 crates/modem-test-support/scripts/dvbt_tables.py --cache "$RUNNER_TEMP/etsi" --out crates/channels/src/datv/dvbt --check

  performance:
    name: Performance gates (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: performance
      - run: cargo xtask perf

  test-build:
    name: Build tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            runner: ubuntu-24.04
          - label: ubuntu-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: ${{ matrix.label }}
          save: ${{ env.SAVE_CACHE }}
          tauri: true
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - run: cargo xtask test archive target/test-archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.label }}
          path: target/test-archive
          compression-level: 0
          retention-days: 1

  test:
    name: Tests (${{ matrix.label }} ${{ matrix.shard }}/4)
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        label: [ubuntu, ubuntu-arm64]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.label == 'ubuntu' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: shard-${{ matrix.label }}
          save: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
          tauri: true
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-${{ matrix.label }}
          path: target/test-archive
      - run: cargo xtask test shard target/test-archive --partition slice:${{ matrix.shard }}/4

  web-test:
    name: Web tests (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
        with:
          cache: web
          save: ${{ env.SAVE_CACHE }}
      - run: cargo xtask test web

  gpu:
    name: GPU parity (ubuntu)
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu
          save: false
      - name: FFT
        env:
          SDRMM_REQUIRE_GPU_FFT_TEST: "1"
        run: >
          cargo test -p sdrmm-engine --all-features
          --lib spectrum::tests::gpu_matches_cpu_when_a_hardware_adapter_is_available
          -- --ignored --exact
      - name: Radar
        run: >
          cargo test -p sdrmm-engine --all-features
          --lib gpu::caf::tests::radar_matches_cpu_across_tiles_and_fractional_doppler
          -- --ignored --exact

  simd:
    name: x86 SIMD kernels under SDE (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: simd
          save: ${{ env.SAVE_CACHE }}
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - run: "cargo test -p sdrmm-dsp --release --lib -- fir:: realiq resamp"
        env:
          SDRMM_REQUIRE_AVX512: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.SDE_PATH }}/sde64 -spr --

  smoke:
    name: Browser smoke (ubuntu)
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu
          save: false
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: cargo xtask smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-trace
          path: web/test-results
          retention-days: 7
