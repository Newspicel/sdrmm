name: Perf baseline

on:
  push:
    branches: [perf-baseline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modem:
    name: Modem perf baseline (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: performance
          save: "false"
      - run: cargo test -p sdrmm-modem-test-support --release -- --ignored --exact ber::perf::tests::write_perf_baseline
        env:
          SDRMM_WRITE_BASELINES: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modem-perf-baseline
          path: crates/modem/baselines/perf_phase0.json
          retention-days: 7

  channels:
    name: Channel perf baseline (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: performance
          save: "false"
      - run: cargo test -p sdrmm-channels --release --test channel_perf -- --ignored --exact write_perf_baseline
        env:
          SDRMM_WRITE_BASELINES: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-perf-baseline
          path: crates/channels/baselines/channel_perf/x86_64-linux.json
          retention-days: 7
