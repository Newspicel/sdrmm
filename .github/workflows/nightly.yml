name: Nightly

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

  measurements:
    name: Measurements (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: nightly
      - name: Modem gates
        run: |
          cargo test -p sdrmm-modem -p sdrmm-modem-test-support --release -- --ignored --skip write_ \
            --skip _perf::
          cargo test -p sdrmm-modem --release --test integration -- --ignored --skip write_ \
            --test-threads=1 _perf::
      - name: Fetch the xng bench captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/reference/xng"
          gh release download bench-fixtures-v1 --repo airframesio/xng --clobber \
            --dir "$RUNNER_TEMP/reference/xng" \
            --pattern acars_100k.cs16 \
            --pattern adsb_quiet_24m.cu8 \
            --pattern ais_96k.cs16 \
            --pattern hfdl_48k.cs16 \
            --pattern navtex_62500.cs16 \
            --pattern vdl2_105k_conj.s16 \
            --pattern vdl2_opflasher_105k.cs16
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/reference/xng/modes1.cu8" \
            https://raw.githubusercontent.com/airframesio/xng/096c805278faa0a904de7d98066bf4cf395cb6c2/bench/data/modes1.cu8
          echo "XNG_BENCH_DATA=$RUNNER_TEMP/reference/xng" >> "$GITHUB_ENV"
      - name: Fetch the SigIDWiki DECT capture
        run: |
          mkdir -p "$RUNNER_TEMP/reference/dect"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/reference/dect.zip" https://www.sigidwiki.com/images/5/5f/Dect.zip; then
            unzip -oq "$RUNNER_TEMP/reference/dect.zip" -d "$RUNNER_TEMP/reference/dect"
            echo "DECT_SIGID_WAV=$RUNNER_TEMP/reference/dect/dect.wav" >> "$GITHUB_ENV"
          else
            echo "::warning::sigidwiki.com did not serve Dect.zip, so the DECT cross-check skips"
          fi
      - name: Fetch the ITU-T G.726 test vectors
        run: |
          mkdir -p "$RUNNER_TEMP/reference/g726"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/reference/g726.zip" \
            'https://www.itu.int/rec/dologin_pub.asp?lang=e&id=T-REC-G.726-199103-I%21AppII%21SOFT-ZST-E&type=items'; then
            unzip -oq "$RUNNER_TEMP/reference/g726.zip" -d "$RUNNER_TEMP/reference/g726"
            unzip -oq "$RUNNER_TEMP/reference/g726/Software.zip" -d "$RUNNER_TEMP/reference/g726"
            echo "G726_VECTORS=$RUNNER_TEMP/reference/g726/software/G726ap2/G726ap2e/DISK2" >> "$GITHUB_ENV"
          else
            echo "::warning::itu.int did not serve the G.726 Appendix II software, so the vector cross-check skips"
          fi
      - name: Reference data no runner can fetch
        run: |
          echo 'STANAG_SIGID_DIR stays unset: all 48 LIBRARY stems of crates/channels/src/stanag/tests/air.rs'
          echo 'as 9.6 kHz mono f32le <stem>.f32. Nine source URLs sit in fixtures/stanag/*.sigmf-meta;'
          echo 'sigidwiki publishes no manifest for the rest, so an operator caches the set once.'
          echo 'FT8_CORPUS stays unset: WSJT-X sample wavs, each beside its published-decode .txt. The wavs'
          echo 'ship inside WSJT-X (save/samples) and the .txt is what jt9 prints, so nothing is downloadable.'
      - name: Channel reference cross-checks
        run: |
          cargo test -p sdrmm-channels --release --test integration -- --ignored --nocapture \
            xng_fixtures:: xng_vdl2:: xng_hfdl::
          cargo test -p sdrmm-channels --release --lib -- --ignored --nocapture \
            names_the_sigidwiki_library \
            reproduces_the_itu_reset_vectors_bit_for_bit \
            decodes_two_real_base_stations_off_air \
            separates_real_bases_moved_onto_two_carriers_of_a_wideband_capture
      - name: Channel measurement sweeps
        run: |
          cargo test -p sdrmm-channels --release --test integration -- --ignored --nocapture \
            --test-threads=1 channel_perf:: datv_perf:: --skip write_perf_baseline
          cargo test -p sdrmm-channels --release --test integration -- --ignored --nocapture \
            dmr_ambe_gain:: dmr_baseline:: dmr_soft_gain::
          cargo test -p sdrmm-channels --release --lib -- --ignored --nocapture \
            --skip write_drm_frame_fixtures \
            --skip names_the_sigidwiki_library \
            --skip reproduces_the_itu_reset_vectors_bit_for_bit \
            --skip decodes_two_real_base_stations_off_air \
            --skip separates_real_bases_moved_onto_two_carriers_of_a_wideband_capture
      - name: BER curves
        run: cargo run -p xtask-gen -- ber bpsk-ideal --full
      - name: Modem benches
        run: cargo bench -p sdrmm-modem -- --test
      - name: DSP benches
        run: cargo bench -p sdrmm-dsp -- --test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ber-curves
          path: target/ber
          if-no-files-found: ignore
          retention-days: 14

  array-realtime:
    name: Array realtime (ubuntu arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: array-realtime
          save: false
      - run: "cargo test -p sdrmm-engine --release --features probe --test integration -- --nocapture array_realtime::"
        env:
          SDRMM_RT_SCALE: "2"

  macos-tests:
    name: Tests (macos-arm64)
    runs-on: macos-15
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: ./.github/actions/rust
        with:
          cache: macos
          save: false
          tauri: true
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - run: cargo xtask test

  mobile:
    name: Mobile core (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ndk
        run: echo "version=$(sed -n 's/^sdrmm.ndkVersion=//p' apps/android/gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ndk;${{ steps.ndk.outputs.version }}
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.ndk.outputs.version }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust
        with:
          cache: mobile
          save: false
      - run: cargo xtask mobile check --android
      - run: cargo xtask mobile bindings

  advisories:
    name: Advisories (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu
          save: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      - run: cargo xtask audit

  nix:
    name: Nix package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            system: x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Build
        run: |
          nix build --impure --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = "${{ matrix.system }}";
              pkgs = builtins.getAttr system flake.inputs.nixpkgs.legacyPackages;
            in
            (builtins.getAttr system flake.packages).default.override {
              soapyPlugins = with pkgs; [ soapybladerf soapyremote ];
            }
          '
      - name: Layout
        run: |
          test -x result/bin/sdrmm-desktop
          test ! -e result/bin/sdrmm
          test -f result/share/applications/sdrmm-desktop.desktop
          test -f result/share/icons/hicolor/128x128/apps/dev.newspicel.sdrmm.png
          test -z "$(find -L result -path '*/SoapySDR/modules*' -print -quit)"
      - name: Linking
        run: |
          ldd result/bin/.sdrmm-desktop-wrapped | tee ldd
          grep -q 'libwebkit2gtk-4.1' ldd
          ! grep -q 'libSoapySDR' ldd
      - name: Wrapper
        run: |
          grep -q 'SDRMM_SOAPY_LIBRARY' result/bin/sdrmm-desktop
          grep -q 'SOAPY_SDR_PLUGIN_PATH' result/bin/sdrmm-desktop
          grep -q 'soapybladerf' result/bin/sdrmm-desktop
          grep -q 'soapyremote' result/bin/sdrmm-desktop
          grep -q 'vulkan-loader' result/bin/sdrmm-desktop
          grep -q 'libglvnd' result/bin/sdrmm-desktop
      - name: Launch
        run: |
          status=0
          timeout 15s xvfb-run --auto-servernum result/bin/sdrmm-desktop > desktop.log 2>&1 || status=$?
          test "$status" -eq 124 || { cat desktop.log; exit 1; }

  desktop:
    name: Desktop shell (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            runner: ubuntu-24.04
          - label: macos
            runner: macos-15
          - label: windows
            runner: windows-2025
          - label: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: desktop-${{ matrix.label }}
          save: false
          tauri: true
      - run: cargo xtask desktop

  ios:
    name: iPhone app (macos)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_27.app
      - uses: ./.github/actions/rust
        with:
          cache: ios
          save: false
      - run: cargo xtask mobile check --ios
      - run: cargo xtask ios lint
      - run: cargo xtask ios test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results
          path: target/ios/results
          retention-days: 7

  android:
    name: Android app (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - id: ndk
        run: echo "version=$(sed -n 's/^sdrmm.ndkVersion=//p' apps/android/gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0 ndk;${{ steps.ndk.outputs.version }}
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.ndk.outputs.version }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust
        with:
          cache: android
          save: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - run: ./gradlew -p build-logic test
        working-directory: apps/android
      - run: ./gradlew spotlessCheck checkSourceRules lintDebug testDebugUnitTest assembleDebug
        working-directory: apps/android
      - run: '"$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 apps/android/app/build/outputs/apk/debug/app-debug.apk'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: apps/android/app/build/reports
          retention-days: 7

  image:
    name: Container image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # The image binds the wildcard address, which the server refuses without a token.
      SDRMM_TOKEN: container-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sdrmm:ci
          build-args: PROFILE=ci
      - name: Version
        run: docker run --rm sdrmm:ci --version
      - name: Doctor
        run: |
          docker run --rm sdrmm:ci --doctor | tee doctor
          grep -q 'compiled backends:.*soapy' doctor
          grep -q 'compiled backends:.*rtlsdr' doctor
          grep -q 'compiled backends:.*hackrf' doctor
          grep -q 'core: 0.8.' doctor
          grep -qi 'bladerf' doctor
          grep -qi 'lms7' doctor
          grep -qi 'remote' doctor
      - name: Start
        run: docker run --detach --name sdrmm-ci --env SDRMM_TOKEN --publish 8080:8080 sdrmm:ci
      - name: Serve UI
        run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null \
            -H "Authorization: Bearer $SDRMM_TOKEN" http://127.0.0.1:8080/api/status
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"'
      - if: failure()
        run: docker logs sdrmm-ci

  ios-ui:
    name: iPhone UI (macos)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_27.app
      - run: xcrun simctl list runtimes | grep -q 'iOS 18.1 ' || xcodebuild -downloadPlatform iOS -buildVersion 18.1 -architectureVariant arm64
      - uses: ./.github/actions/rust
        with:
          cache: ios
          save: false
      - run: cargo xtask ios test --ui --floor
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-results
          path: target/ios/results
          retention-days: 14

  ios-e2e:
    name: iPhone end to end (macos)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_27.app
      - uses: ./.github/actions/rust
        with:
          cache: ios
          save: false
      - run: cargo xtask ios e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-e2e-results
          path: |
            target/ios/results
            target/ios/e2e/server.log
          retention-days: 14

  android-device:
    name: Android device tests (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - id: ndk
        run: echo "version=$(sed -n 's/^sdrmm.ndkVersion=//p' apps/android/gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0 ndk;${{ steps.ndk.outputs.version }}
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.ndk.outputs.version }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust
        with:
          cache: android
          save: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports
          path: apps/android/app/build/reports/androidTests
          retention-days: 14

  sanitizers:
    name: Sanitizers (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: sanitize
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo xtask sanitize

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target:
          - channel_chain
          - channel_settings
          - cps_image
          - dv_voice
          - iqlink_header
          - media_bitstream
          - net_radio_proto
          - recorder_import
          - workspace_import
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache: fuzz
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: cargo xtask fuzz --target ${{ matrix.target }} --seconds 14400 --jobs 4
      - name: Minimize corpus
        if: always()
        run: cargo xtask fuzz --target ${{ matrix.target }} --minimize
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
