[package]
name = "sdrmm-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
num-complex = "0.4"
serde_json = "1"
sdrmm-channels = { path = "../crates/channels", features = ["fuzzing", "synth"] }
sdrmm-cps = { path = "../crates/cps" }
sdrmm-device-kiwisdr = { path = "../crates/device-kiwisdr", features = ["fuzzing"] }
sdrmm-device-rtltcp = { path = "../crates/device-rtltcp", features = ["fuzzing"] }
sdrmm-device-sdrconnect = { path = "../crates/device-sdrconnect", features = ["fuzzing"] }
sdrmm-device-spyserver = { path = "../crates/device-spyserver", features = ["fuzzing"] }
sdrmm-iqlink = { path = "../crates/iqlink" }
sdrmm-recorder = { path = "../crates/recorder" }
sdrmm-wire = { path = "../crates/wire" }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[bin]]
name = "channel_chain"
path = "fuzz_targets/channel_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_settings"
path = "fuzz_targets/channel_settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cps_image"
path = "fuzz_targets/cps_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dv_voice"
path = "fuzz_targets/dv_voice.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iqlink_header"
path = "fuzz_targets/iqlink_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_bitstream"
path = "fuzz_targets/media_bitstream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "net_radio_proto"
path = "fuzz_targets/net_radio_proto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recorder_import"
path = "fuzz_targets/recorder_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workspace_import"
path = "fuzz_targets/workspace_import.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
