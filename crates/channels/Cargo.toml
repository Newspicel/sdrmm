[package]
name = "sdrmm-channels"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
synth = []
fixtures = ["synth"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
sdrmm-modem.workspace = true
sdrmm-decoder.workspace = true
sdrmm-crypto.workspace = true
sdrmm-codec.workspace = true
sdrmm-aviation.workspace = true
sdrmm-media.workspace = true
num-complex.workspace = true
realfft.workspace = true
rtrb.workspace = true
thiserror.workspace = true
blip25-vocoder.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true

[dev-dependencies]
ctor.workspace = true
criterion.workspace = true
sdrmm-test-support = { workspace = true, features = ["denoise-models", "xng"] }
sdrmm-decoder-test-support.workspace = true
sdrmm-dsp = { workspace = true, features = ["test-scene"] }
sdrmm-modem-test-support.workspace = true
# The coded-baseline artifacts (tests/integration/dmr_soft_gain.rs) bundle three labelled curves
# per file, a shape `sweep::save_json` (one bare Curve) does not cover.
serde.workspace = true
serde_json.workspace = true
# Dev-dependency on ourselves so integration tests see `synth` and its fixtures,
# which `#[cfg(test)]` alone does not enable for tests/ targets.
sdrmm-channels = { workspace = true, features = ["fixtures"] }
sdrmm-codec = { workspace = true, features = ["testutil"] }
sdrmm-aviation = { workspace = true, features = ["testing"] }
sdrmm-media = { workspace = true, features = ["testing"] }
blip25-vocoder = { workspace = true, features = ["encode"] }
codec2.workspace = true
xng-mode-hfdl.workspace = true
xng-mode-aero.workspace = true
xng-types.workspace = true
mfsk-core.workspace = true
xng-mode-dsc.workspace = true
xng-mode-stdc.workspace = true
xng-mode-vdl2.workspace = true
xng-mode-iridium.workspace = true

[[bench]]
name = "perf"
harness = false
