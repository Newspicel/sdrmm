[package]
name = "sdrmm-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sdrmm-desktop"
path = "src/main.rs"

[[bin]]
name = "sdrmm-desktop-helper"
path = "src/helper.rs"

[lints]
workspace = true

[features]
default = ["soapy", "sdrplay", "rtlsdr", "hackrf", "airspy", "airspyhf", "funcube", "espsdr", "ad936x", "net-client", "gpu-fft"]
soapy = ["sdrmm-server/soapy", "sdrmm-engine/soapy", "dep:sdrmm-device-soapy"]
sdrplay = ["sdrmm-server/sdrplay", "sdrmm-engine/sdrplay"]
rtlsdr = ["sdrmm-server/rtlsdr", "sdrmm-engine/rtlsdr"]
hackrf = ["sdrmm-server/hackrf", "sdrmm-engine/hackrf"]
airspy = ["sdrmm-server/airspy", "sdrmm-engine/airspy"]
airspyhf = ["sdrmm-server/airspyhf", "sdrmm-engine/airspyhf"]
funcube = ["sdrmm-server/funcube", "sdrmm-engine/funcube"]
espsdr = ["sdrmm-server/espsdr", "sdrmm-engine/espsdr"]
ad936x = ["sdrmm-server/ad936x", "sdrmm-engine/ad936x"]
net-client = ["sdrmm-server/net-client", "sdrmm-engine/net-client"]
gpu-fft = ["sdrmm-server/gpu-fft", "sdrmm-engine/gpu-fft"]
dvsi = ["sdrmm-server/dvsi"]

[build-dependencies]
winresource = "0.1.34"

[dependencies]
sdrmm-server.workspace = true
sdrmm-engine.workspace = true
sdrmm-plugins.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
anyhow.workspace = true
cef = { version = "156.4.0", default-features = false, features = ["sandbox"] }
cargo-packager-updater = "0.2.3"
dirs.workspace = true
notify-rust = "4.19.0"
opener = { version = "0.9.0", features = ["reveal"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "common-controls-v6"] }
semver = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tracing.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSThread"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }

[dev-dependencies]
tempfile.workspace = true
